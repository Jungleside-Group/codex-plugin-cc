# Keeps the supply chain patched: GitHub Actions pins and npm deps. Free on
# private repos. Action bumps are grouped into one PR; npm minor/patch grouped,
# majors raised individually for deliberate review.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
